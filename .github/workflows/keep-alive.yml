# Keeps the Render free service awake with RANDOM gaps of 12:00 - 14:50
# (minutes and seconds both random) between pings, instead of a fixed 13 min.
#
# How: the workflow ticks every 5 min (GitHub's minimum). scripts/scheduled_ping.py
# holds a hash-based random schedule; if a ping is due inside this tick's
# window it sleeps until that exact second, then pings /health.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> New secret
#   RENDER_HEALTH_URL = https://hungmen-n24h.onrender.com/health
#
# Note: ~8,600 short runs/month. Free for PUBLIC repos; private repos only get
# 2,000 free minutes/month.

name: Keep Render Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Ping now, ignoring the random schedule
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ping Render if due
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--force"; fi
          python3 scripts/scheduled_ping.py \
            --url "$RENDER_HEALTH_URL" \
            --min 720 --max 890 --window 300 --salt render $ARGS
