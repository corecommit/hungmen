name: Keep Supabase Awake

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Ping now, ignoring the random schedule
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase if due
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--force"; fi
          python3 scripts/scheduled_ping.py \
            --url "${SUPABASE_URL%/}/rest/v1/users?select=username&limit=1" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --min 432000 --max 518400 --window 3600 --salt supabase $ARGS
